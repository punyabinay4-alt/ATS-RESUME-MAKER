<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Friendly Resume Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background: #f5f5f5; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
.front-page { text-align: center; padding: 60px 20px; background: #fff; border-radius: 12px; margin-bottom: 20px; }
.front-page h1 { font-size: 32px; color: #000; margin-bottom: 30px; }
.btn-main { background: #000; color: #fff; border: none; padding: 14px 30px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin: 10px; }
.form-page { display: none; background: #fff; padding: 30px; border-radius: 12px; }
.section { margin-bottom: 25px; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
.section h2 { color: #000; margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 8px; }
.input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 12px; }
input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
textarea { resize: vertical; min-height: 80px; }
.photo-upload { display: flex; gap: 15px; align-items: center; }
.photo-preview { width: 100px; height: 100px; border: 2px solid #000; border-radius: 50%; object-fit: cover; }
.btn-add { background: #000; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 10px; }
.btn-remove { background: #cc0000; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.table-entry { border: 1px solid #eee; padding: 12px; margin-bottom: 10px; border-radius: 6px; position: relative; }
.ats-box { background: #000; color: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
.ats-score { font-size: 48px; font-weight: 700; }
.ats-suggestions { text-align: left; margin-top: 15px; font-size: 13px; }
#resumeTemplate { display: none; background: #fff; padding: 40px; color: #000; max-width: 800px; margin: 0 auto; }
#resumeTemplate h1 { font-size: 24px; text-align: center; }
#resumeTemplate h2 { font-size: 16px; border-bottom: 1px solid #000; margin: 15px 0 8px 0; padding-bottom: 4px; }
#resumeTemplate.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
#resumeTemplate.header img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #000; }
table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
table, th, td { border: 1px solid #000; }
th, td { padding: 6px; text-align: left; }
.footer-copy { text-align: center; font-size: 12px; margin-top: 30px; color: #555; }
.action-btns { text-align: center; margin-top: 20px; }
@media print {.container { display: none; } }
</style>
</head>
<body>

<div class="container">
  <div class="front-page" id="frontPage">
    <h1>Job Friendly Resume Maker</h1>
    <button class="btn-main" onclick="showForm()">CREATE RESUME</button>
    <button class="btn-main" onclick="showATS()">CHECK ATS SCORE</button>
    <div class="footer-copy">©️ COPYRIGHT RESERVED BY PUNYA BINAY SWAIN</div>
  </div>

  <div class="form-page" id="formPage">
    <button class="btn-main" onclick="backToFront()">⬅ BACK</button>

    <div id="atsResult" class="ats-box" style="display:none;">
      <div>ATS SCORE</div>
      <div class="ats-score" id="atsScore">0%</div>
      <div class="ats-suggestions" id="atsSuggestions"></div>
    </div>

    <form id="resumeForm">
      <!-- 1. PERSONAL DETAILS -->
      <div class="section">
        <h2>1. PERSONAL DETAILS</h2>
        <div class="input-group">
          <input type="text" id="name" placeholder="Full Name">
          <input type="date" id="dob" placeholder="Date of Birth">
        </div>
        <div class="input-group">
          <input type="tel" id="mobile" placeholder="Mobile Number">
          <input type="email" id="email" placeholder="Email ID">
        </div>
        <input type="text" id="address" placeholder="Address" style="margin-bottom:12px;">
        <div class="input-group">
          <input type="url" id="linkedin" placeholder="LinkedIn Link">
          <input type="url" id="github" placeholder="GitHub Link">
        </div>
        <div class="photo-upload">
          <input type="file" id="photo" accept="image/*" onchange="previewPhoto(event)">
          <img id="photoPreview" class="photo-preview" style="display:none;">
        </div>
        <textarea id="objective" placeholder="Career Objective - Unlimited words"></textarea>
      </div>

      <!-- 2. QUALIFICATION -->
      <div class="section">
        <h2>2. QUALIFICATION</h2>
        <div id="qualificationList"></div>
        <button type="button" class="btn-add" onclick="addQualification()">+ Add Qualification</button>
      </div>

      <!-- 3. PROJECTS -->
      <div class="section">
        <h2>3. PROJECTS</h2>
        <div id="projectList"></div>
        <button type="button" class="btn-add" onclick="addProject()">+ Add Project</button>
      </div>

      <!-- 4. SKILLS -->
      <div class="section">
        <h2>4. SKILLS</h2>
        <textarea id="technicalSkills" placeholder="Technical Skills - comma separated"></textarea>
        <textarea id="softSkills" placeholder="Soft Skills - comma separated" style="margin-top:10px;"></textarea>
      </div>

      <!-- 5. EXPERIENCE -->
      <div class="section">
        <h2>5. EXPERIENCE</h2>
        <div id="experienceList"></div>
        <button type="button" class="btn-add" onclick="addExperience()">+ Add Experience</button>
      </div>

      <!-- 6. DECLARATION -->
      <div class="section">
        <h2>6. DECLARATION</h2>
        <textarea id="declaration" placeholder="Declaration - Unlimited words"></textarea>
      </div>

      <div class="action-btns">
        <button type="button" class="btn-main" onclick="generateResume()">GENERATE & DOWNLOAD PDF</button>
      </div>
    </form>
  </div>
</div>

<!-- RESUME TEMPLATE FOR PDF -->
<div id="resumeTemplate">
  <div class="header">
    <div>
      <h1 id="r_name"></h1>
      <p id="r_contact"></p>
      <p id="r_links"></p>
    </div>
    <img id="r_photo">
  </div>

  <p id="r_objective"></p>

  <h2>EDUCATION</h2>
  <table id="r_qualification"></table>

  <h2>PROJECTS</h2>
  <table id="r_projects"></table>

  <h2>SKILLS</h2>
  <p><b>Technical Skills:</b> <span id="r_tech"></span></p>
  <p><b>Soft Skills:</b> <span id="r_soft"></span></p>

  <h2>EXPERIENCE</h2>
  <table id="r_experience"></table>

  <h2>DECLARATION</h2>
  <p id="r_declaration"></p>
</div>

<script>
let qCount=0, pCount=0, eCount=0;

function showForm(){ document.getElementById('frontPage').style.display='none'; document.getElementById('formPage').style.display='block'; }
function backToFront(){ document.getElementById('frontPage').style.display='block'; document.getElementById('formPage').style.display='none'; }

function previewPhoto(e){
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(ev){
      document.getElementById('photoPreview').src = ev.target.result;
      document.getElementById('photoPreview').style.display = 'block';
    }
    reader.readAsDataURL(file);
  }
}

function addQualification(){
  qCount++;
  document.getElementById('qualificationList').innerHTML += `
  <div class="table-entry" id="q${qCount}">
    <input placeholder="Course Name">
    <input placeholder="Institute Name">
    <input placeholder="University/Board">
    <div class="input-group">
      <input placeholder="Pass Out Year">
      <input placeholder="Percentage/CGPA">
    </div>
    <button type="button" class="btn-remove" onclick="document.getElementById('q${qCount}').remove()">Remove</button>
  </div>`;
}

function addProject(){
  pCount++;
  document.getElementById('projectList').innerHTML += `
  <div class="table-entry" id="p${pCount}">
    <input placeholder="Project Name">
    <textarea placeholder="Project Description"></textarea>
    <button type="button" class="btn-remove" onclick="document.getElementById('p${pCount}').remove()">Remove</button>
  </div>`;
}

function addExperience(){
  eCount++;
  document.getElementById('experienceList').innerHTML += `
  <div class="table-entry" id="e${eCount}">
    <input placeholder="Employer Name">
    <div class="input-group">
      <input type="date" placeholder="Joining Date">
      <input type="date" placeholder="Leaving Date">
    </div>
    <textarea placeholder="Description"></textarea>
    <button type="button" class="btn-remove" onclick="document.getElementById('e${eCount}').remove()">Remove</button>
  </div>`;
}

function checkATS(){
  let score = 0; let suggestions = [];
  if(document.getElementById('name').value) score+=10; else suggestions.push("Add Full Name");
  if(document.getElementById('email').value) score+=10; else suggestions.push("Add Email");
  if(document.getElementById('mobile').value) score+=10; else suggestions.push("Add Mobile");
  if(document.getElementById('technicalSkills').value) score+=20; else suggestions.push("Add Technical Skills");
  if(document.getElementById('objective').value.length>50) score+=15; else suggestions.push("Add detailed Career Objective");
  if(qCount>0) score+=15; else suggestions.push("Add Education Details");
  if(pCount>0 || eCount>0) score+=20; else suggestions.push("Add Projects or Experience");

  document.getElementById('atsScore').innerText = score + "%";
  document.getElementById('atsSuggestions').innerHTML = "<b>Suggestions:</b><br>" + suggestions.join("<br>");
  document.getElementById('atsResult').style.display='block';
}

function showATS(){ showForm(); checkATS(); }

function generateResume(){
  // Fill template
  document.getElementById('r_name').innerText = document.getElementById('name').value || "Your Name";
  document.getElementById('r_contact').innerText = `${document.getElementById('mobile').value} | ${document.getElementById('email').value} | ${document.getElementById('address').value}`;
  document.getElementById('r_links').innerHTML = `LinkedIn: ${document.getElementById('linkedin').value}<br>GitHub: ${document.getElementById('github').value}`;
  document.getElementById('r_photo').src = document.getElementById('photoPreview').src || "";
  document.getElementById('r_objective').innerText = document.getElementById('objective').value;

  // Qualification Table
  let qHTML = "<tr><th>Course</th><th>Institute</th><th>Board/University</th><th>Year</th><th>Score</th></tr>";
  document.querySelectorAll('#qualificationList.table-entry').forEach(el=>{
    let inputs = el.querySelectorAll('input');
    qHTML += `<tr><td>${inputs[0].value}</td><td>${inputs[1].value}</td><td>${inputs[2].value}</td><td>${inputs[3].value}</td><td>${inputs[4].value}</td></tr>`;
  });
  document.getElementById('r_qualification').innerHTML = qHTML;

  // Projects
  let pHTML = "<tr><th>Project Name</th><th>Description</th></tr>";
  document.querySelectorAll('#projectList.table-entry').forEach(el=>{
    let inputs = el.querySelectorAll('input,textarea');
    pHTML += `<tr><td>${inputs[0].value}</td><td>${inputs[1].value}</td></tr>`;
  });
  document.getElementById('r_projects').innerHTML = pHTML;

  document.getElementById('r_tech').innerText = document.getElementById('technicalSkills').value;
  document.getElementById('r_soft').innerText = document.getElementById('softSkills').value;

  // Experience
  let eHTML = "<tr><th>Employer</th><th>Duration</th><th>Description</th></tr>";
  document.querySelectorAll('#experienceList.table-entry').forEach(el=>{
    let inputs = el.querySelectorAll('input,textarea');
    eHTML += `<tr><td>${inputs[0].value}</td><td>${inputs[1].value} to ${inputs[2].value}</td><td>${inputs[3].value}</td></tr>`;
  });
  document.getElementById('r_experience').innerHTML = eHTML;

  document.getElementById('r_declaration').innerText = document.getElementById('declaration').value;

  // Generate PDF
  const element = document.getElementById('resumeTemplate');
  const opt = { margin: 0.5, filename: 'Resume.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } };
  html2pdf().set(opt).from(element).save();
}

// Add 1 default entry
addQualification(); addProject(); addExperience();
</script>

</body>
</html>
